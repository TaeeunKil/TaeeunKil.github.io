<!doctype html><html lang="ko"><head><base href="../../../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Strata 설명 그림과 실측 그래프</title><link rel="stylesheet" href="assets/fonts/fonts.css"><link rel="stylesheet" href="assets/posts/strata-study/diagrams.css"><script src="assets/posts/strata-study/diagrams.js" defer></script><style>body{background:#f2f1ed;color:#171716;font:16px/1.8 Pretendard,system-ui,sans-serif;margin:0}main{max-width:752px;padding:0 20px;margin:40px auto}h1{font-size:28px}h2{font-size:22px;margin-top:64px}</style></head><body><main><h1>Strata 설명 그림과 실측 그래프</h1><h2>장치별 역할</h2><figure class="st-visual" id="strata-devices"><div class="st-pair"><div class="st-panel"><p class="st-panel-title">GPU가 계산하는 경로</p><svg viewBox="0 0 360 368" role="img" aria-labelledby="st-gpu-title st-gpu-desc"><title id="st-gpu-title">GPU와 VRAM의 역할</title><desc id="st-gpu-desc">GPU가 VRAM의 가중치를 읽어 공통 연산과 캐시에 있는 전문가를 계산한다. 저장 장치가 계산하는 것은 아니다.</desc><defs><marker id="st-gpu-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6d6b66"/></marker><marker id="st-gpu-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#bf3b21"/></marker><marker id="st-gpu-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#171716"/></marker></defs>
 <path class="st-arrow" d="M180 224 V152" marker-end="url(#st-gpu-arrow)"/>
 <rect class="st-node" x="24" y="48" width="312" height="104" rx="4"/>
 <rect class="st-store" x="24" y="224" width="312" height="104" rx="4"/>
 <text x="180" y="84" text-anchor="middle" class="st-bold">GPU / 계산</text>
 <text x="180" y="116" text-anchor="middle" class="st-small">공통 연산 + 캐시 전문가</text>
 <rect x="196" y="168" width="120" height="32" fill="#f2f1ed"/><text x="200" y="192" class="st-small">가중치 읽기</text>
 <text x="180" y="264" text-anchor="middle" class="st-bold">VRAM / 보관</text>
 <text x="180" y="296" text-anchor="middle" class="st-small">전문가 캐시와 KV 일부</text>
 <text x="180" y="360" text-anchor="middle" class="st-small">자주 쓰는 전문가를 빠른 쪽에</text>
 </svg></div><div class="st-panel"><p class="st-panel-title">CPU가 계산하는 경로</p><svg viewBox="0 0 360 368" role="img" aria-labelledby="st-cpu-title st-cpu-desc"><title id="st-cpu-title">CPU와 RAM의 역할</title><desc id="st-cpu-desc">CPU가 RAM의 가중치를 읽어 GPU 캐시에 없는 선택 전문가를 계산한다. 저장 장치가 계산하는 것은 아니다.</desc><defs><marker id="st-cpu-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6d6b66"/></marker><marker id="st-cpu-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#bf3b21"/></marker><marker id="st-cpu-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#171716"/></marker></defs>
 <path class="st-arrow" d="M180 224 V152" marker-end="url(#st-cpu-arrow)"/>
 <rect class="st-node" x="24" y="48" width="312" height="104" rx="4"/>
 <rect class="st-store" x="24" y="224" width="312" height="104" rx="4"/>
 <text x="180" y="84" text-anchor="middle" class="st-bold">CPU / 계산</text>
 <text x="180" y="116" text-anchor="middle" class="st-small">미상주 선택 전문가</text>
 <rect x="196" y="168" width="120" height="32" fill="#f2f1ed"/><text x="200" y="192" class="st-small">가중치 읽기</text>
 <text x="180" y="264" text-anchor="middle" class="st-bold">RAM / 보관</text>
 <text x="180" y="296" text-anchor="middle" class="st-small">전문가 가중치와 버퍼</text>
 <text x="180" y="360" text-anchor="middle" class="st-small">GPU 복사본과 함께 존재할 수 있음</text>
 </svg></div></div><p class="st-storage"><strong>SSD</strong>에는 모델 원본과 약 29GB의 n-gram 조회 테이블을 둔다. 테이블은 추론 중에도 필요한 행만 읽는다.</p><figcaption>그림 1. 이번 Qwen 계열 구성의 저장 위치와 계산 장치를 구분했다. 주로 decode의 전문가 연산을 설명한 그림이며 긴 입력의 prefill 경로는 다르다. KV와 전문가 상주량은 모드와 예산에 따라 달라진다. <a href="https://github.com/Niko1221/Strata/blob/v0.2.13/docs/HOW_IT_WORKS.md">공식 동작 설명</a>을 바탕으로 직접 그렸다.</figcaption></figure><h2>같은 선택과 다른 배치</h2><figure class="st-visual" id="strata-placement" data-strata-placement>
 <div class="st-controls" hidden role="group" aria-label="선택된 전문가의 GPU 캐시 상태 바꾸기"><button type="button" data-cache-state="miss" aria-pressed="true">E5는 RAM에만</button><button type="button" data-cache-state="hit" aria-pressed="false">둘 다 GPU 캐시에</button></div>
 <div class="st-single"><svg viewBox="0 0 360 508" role="img" aria-labelledby="st-place-title st-place-desc"><title id="st-place-title">같은 전문가 선택을 다른 장치에서 계산하기</title><desc id="st-place-desc" data-placement-desc>설명용 배치 예시. 모델이 E2와 E5를 선택한 상태다. GPU는 E2를 계산하고 CPU는 RAM의 E5를 읽어 계산한다. 필요한 결과를 합쳐 다음 계산으로 간다. 실제 모델 실행 결과가 아니다.</desc><defs><marker id="st-place-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6d6b66"/></marker><marker id="st-place-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#bf3b21"/></marker><marker id="st-place-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#171716"/></marker></defs>
 <path class="st-arrow" d="M180 40 V72" marker-end="url(#st-place-arrow)"/>
 <path class="st-arrow" d="M164 136 V168 Q164 176 156 176 H96 Q88 176 88 184 V208" marker-end="url(#st-place-arrow)"/>
 <path class="st-arrow" d="M196 136 V168 Q196 176 204 176 H264 Q272 176 272 184 V208" marker-end="url(#st-place-arrow)" data-cpu-path/>
 <path class="st-arrow" d="M88 320 V368 Q88 376 96 376 H136 Q144 376 144 384 V416" marker-end="url(#st-place-arrow)"/>
 <path class="st-arrow" d="M272 320 V368 Q272 376 264 376 H224 Q216 376 216 384 V416" marker-end="url(#st-place-arrow)" data-cpu-path/>
 <rect class="st-node" x="40" y="72" width="280" height="64" rx="4"/>
 <rect class="st-node" x="8" y="208" width="160" height="112" rx="4"/>
 <rect class="st-focus" x="192" y="208" width="160" height="112" rx="4" data-cpu-box/>
 <rect class="st-node" x="80" y="416" width="200" height="64" rx="4"/>
 <text x="180" y="24" text-anchor="middle">모델의 선택: E2 + E5</text>

 <text x="180" y="112" text-anchor="middle" class="st-bold">Strata가 캐시 위치를 확인</text>
 <text x="88" y="244" text-anchor="middle" class="st-bold">GPU</text><text x="88" y="280" text-anchor="middle" data-gpu-experts>E2</text><text x="88" y="308" text-anchor="middle" class="st-small">VRAM을 읽음</text>
 <text x="272" y="244" text-anchor="middle" class="st-bold">CPU</text><text x="272" y="280" text-anchor="middle" data-cpu-experts>E5</text><text x="272" y="308" text-anchor="middle" class="st-small" data-cpu-source>RAM을 읽음</text>
 <text x="180" y="456" text-anchor="middle">필요한 결과를 합침</text>
 </svg></div>
 <p class="st-status" data-placement-status aria-live="polite">선택은 E2와 E5다. GPU는 E2를 계산하고 CPU는 RAM의 E5를 읽어 계산한다.</p>
 <div class="st-wait" data-wait-example><div class="st-single"><svg viewBox="0 0 360 184" role="img" aria-labelledby="st-wait-title st-wait-desc"><title id="st-wait-title">CPU 완료를 기다리는 경우</title><desc id="st-wait-desc">GPU 계산이 먼저 끝나도 CPU 결과가 필요하면 합류까지 기다린다. 길이와 시간 비율은 설명용이며 측정값이 아니다.</desc>
 <text x="8" y="24" class="st-small">GPU 계산이 먼저 끝난 경우의 모식도</text>
 <rect x="88" y="44" width="80" height="28" fill="#d6d4ce"/><rect x="168" y="44" width="144" height="28" fill="none" stroke="#6d6b66" stroke-dasharray="4 4"/>
 <rect x="88" y="96" width="224" height="28" fill="#f8e5df" stroke="#bf3b21"/>
 <text x="8" y="64" class="st-bold">GPU</text><text x="8" y="116" class="st-bold">CPU</text><text x="240" y="64" text-anchor="middle" class="st-small">결과 대기</text>
 <path d="M312 40 V140" stroke="#6d6b66" stroke-width="1"/><text x="312" y="168" text-anchor="end" class="st-small">필요한 결과가 모임</text>
 </svg></div><p>GPU가 먼저 끝나도 CPU의 결과가 필요하면 기다린다. 막대의 길이는 설명용이며 실측 시간이 아니다.</p></div>
 <figcaption>그림 2. 첫 글과 같은 전문가 E2와 E5를 고른 상태에서 배치만 바꾼 설명용 예시다. 전문가 수와 선택 수는 실제 모델 사양이 아니다. 선택 결과를 바꾸거나 실제 모델을 실행하는 버튼은 아니다. 두 가중치가 모두 GPU에 있으면 이 예시의 CPU 전문가 연산이 사라진다. 공통 연산과 다른 병목은 남으므로 특정 속도 향상을 보장하지 않는다.</figcaption></figure><h2>GPU 두 장의 분담</h2><figure class="st-visual" id="strata-gpu-split"><div class="st-pair">
 <div class="st-panel"><p class="st-panel-title">기존 vLLM / TP=2</p><svg viewBox="0 0 360 392" role="img" aria-labelledby="st-tp-title st-tp-desc"><title id="st-tp-title">같은 층을 두 GPU가 나누는 텐서 병렬</title><desc id="st-tp-desc">GPU A와 B가 같은 층의 일부 계산을 맡고 부분 결과를 합치는 통신을 반복한다. 실제 collective 구현이나 횟수는 생략한 개략도다.</desc><defs><marker id="st-tp-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6d6b66"/></marker><marker id="st-tp-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#bf3b21"/></marker><marker id="st-tp-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#171716"/></marker></defs>
 <g class="st-arrow" marker-end="url(#st-tp-arrow)"><path d="M152 92 H208"/><path d="M208 116 H152"/><path d="M88 136 V248"/><path d="M272 136 V248"/><path d="M152 268 H208"/><path d="M208 292 H152"/></g>
 <rect class="st-node" x="24" y="72" width="128" height="64" rx="4"/><rect class="st-node" x="208" y="72" width="128" height="64" rx="4"/><rect class="st-node" x="24" y="248" width="128" height="64" rx="4"/><rect class="st-node" x="208" y="248" width="128" height="64" rx="4"/>
 <text x="88" y="40" text-anchor="middle" class="st-bold">GPU A</text><text x="272" y="40" text-anchor="middle" class="st-bold">GPU B</text>
 <text x="88" y="112" text-anchor="middle" class="st-small">층 j 일부</text><text x="272" y="112" text-anchor="middle" class="st-small">층 j 일부</text><text x="88" y="288" text-anchor="middle" class="st-small">층 j+1 일부</text><text x="272" y="288" text-anchor="middle" class="st-small">층 j+1 일부</text>
 <text x="180" y="192" text-anchor="middle" class="st-small">부분 결과 합산</text><text x="180" y="368" text-anchor="middle" class="st-small">층을 거치며 통신 반복</text></svg></div>
 <div class="st-panel"><p class="st-panel-title">이번 Strata / 층 분할</p><svg viewBox="0 0 360 392" role="img" aria-labelledby="st-layer-title st-layer-desc"><title id="st-layer-title">연속된 층 범위를 나누는 실행</title><desc id="st-layer-desc">GPU A가 앞쪽 24개 층을 처리하고 경계에서 중간 결과를 GPU B로 전달한다. B가 뒤쪽 24개 층을 처리한다. 주요 forward 경로만 표시했다.</desc><defs><marker id="st-layer-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6d6b66"/></marker><marker id="st-layer-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#bf3b21"/></marker><marker id="st-layer-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#171716"/></marker></defs>
 <path class="st-arrow" d="M88 184 V216 Q88 224 96 224 H264 Q272 224 272 232 V248" marker-end="url(#st-layer-arrow)"/>
 <rect class="st-node" x="24" y="72" width="128" height="112" rx="4"/><rect class="st-focus" x="208" y="248" width="128" height="112" rx="4"/>
 <text x="88" y="112" text-anchor="middle" class="st-bold">GPU A</text><text x="88" y="148" text-anchor="middle" class="st-small">앞 24개 층</text><text x="272" y="288" text-anchor="middle" class="st-bold">GPU B</text><text x="272" y="324" text-anchor="middle" class="st-small">뒤 24개 층</text>
 <rect x="128" y="192" width="104" height="24" fill="#f2f1ed"/><text x="180" y="208" text-anchor="middle" class="st-small">중간 결과</text><text x="180" y="388" text-anchor="middle" class="st-small">주요 forward 경로만 표시</text></svg></div></div>
 <figcaption>그림 3. 같은 층의 계산을 나누는 TP와 연속된 층 범위를 나누는 실행의 개략도다. 통신 메시지 수나 대역폭을 측정한 그림은 아니다. Strata의 24/24는 이번 설정이며 앞 GPU의 결과를 뒤 GPU가 기다리는 구간도 있다. <a href="https://github.com/Niko1221/Strata/blob/v0.2.13/docs/MULTI_GPU.md">층 분할 문서</a>를 참고했다.</figcaption></figure><h2>응답 시간 실측</h2><figure class="st-visual" id="strata-response-chart"><div class="st-pair"><div class="st-panel"><p class="st-panel-title">첫 본문까지의 시간</p><img class="st-chart" src="assets/posts/strata-study/first-content.svg" width="360" height="460" alt="각 3회 중앙값. 첫 본문은 영어 27B 0.218초, Strata 1.045초. 한국어 0.202초와 1.051초. 약 4.4K 조회 2.515초와 7.090초."></div><div class="st-panel"><p class="st-panel-title">전체 완료까지의 시간</p><img class="st-chart" src="assets/posts/strata-study/completion.svg" width="360" height="460" alt="각 3회 중앙값. 전체 완료는 영어 27B 5.380초, Strata 3.041초. 한국어 4.880초와 3.747초. 약 4.4K 조회 2.666초와 7.190초."></div></div><figcaption>그림 4. 같은 질문을 두 배포에 각각 3회 보낸 실측의 중앙값이다. 단위는 초이며 짧을수록 빠르다. 두 그래프 모두 0~8초 축을 썼다. 모델과 양자화, GPU 구성과 엔진이 달라 Strata 엔진만의 성능 비교는 아니다. 각 지표의 중앙값을 따로 그렸으며 첫 본문 시간과 전체 시간을 하나의 실행처럼 합치지 않았다.</figcaption></figure></main></body></html>
