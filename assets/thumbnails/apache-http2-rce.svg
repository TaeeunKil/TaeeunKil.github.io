<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Apache HTTP/2 security note</title>
  <desc id="desc">A typographic cover for CVE-2026-119618 and the Apache HTTP Server patch.</desc>
  <rect width="640" height="400" fill="#e5e8df"/>
