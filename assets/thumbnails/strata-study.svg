<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="strata-thumb-title strata-thumb-desc">
  <title id="strata-thumb-title">Strata의 GPU와 CPU 계산 분담</title>
  <desc id="strata-thumb-desc">GPU는 VRAM을 읽고 CPU는 RAM을 읽어 큰 MoE 모델의 계산을 나눠 맡는다.</desc>
  <defs><marker id="strata-thumb-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6d6b66"/></marker></defs>
  <rect width="640" height="400" fill="#f2f1ed"/>
  <text x="40" y="52" fill="#bf3b21" font-family="Pretendard,system-ui,sans-serif" font-size="16" font-weight="700">LLM / STRATA</text>
  <text x="40" y="120" fill="#171716" font-family="Pretendard,system-ui,sans-serif" font-size="48" font-weight="700">Strata</text>
  <text x="40" y="164" fill="#171716" font-family="Pretendard,system-ui,sans-serif" font-size="24">GPU와 CPU가 나눠 계산하기</text>
  <path d="M160 304 V268" fill="none" stroke="#6d6b66" stroke-width="2" marker-end="url(#strata-thumb-arrow)"/>
  <path d="M480 304 V268" fill="none" stroke="#6d6b66" stroke-width="2" marker-end="url(#strata-thumb-arrow)"/>
  <rect x="40" y="204" width="240" height="64" fill="#fff" stroke="#6d6b66"/>
  <rect x="360" y="204" width="240" height="64" fill="#f8e5df" stroke="#bf3b21"/>
  <rect x="40" y="304" width="240" height="40" fill="#e9e8e2" stroke="#6d6b66"/>
  <rect x="360" y="304" width="240" height="40" fill="#e9e8e2" stroke="#6d6b66"/>
  <text x="160" y="244" text-anchor="middle" fill="#171716" font-family="Pretendard,system-ui,sans-serif" font-size="28" font-weight="700">GPU</text>
  <text x="480" y="244" text-anchor="middle" fill="#171716" font-family="Pretendard,system-ui,sans-serif" font-size="28" font-weight="700">CPU</text>
  <text x="160" y="332" text-anchor="middle" fill="#171716" font-family="Pretendard,system-ui,sans-serif" font-size="20">VRAM</text>
  <text x="480" y="332" text-anchor="middle" fill="#171716" font-family="Pretendard,system-ui,sans-serif" font-size="20">RAM</text>
  <text x="40" y="384" fill="#6d6b66" font-family="Pretendard,system-ui,sans-serif" font-size="16">전문가 선택 다음으로 살펴본 계산 위치와 실제 병목</text>
</svg>
